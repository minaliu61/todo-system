<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作业代办系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
        }

        #app {
            height: 100%;
            width: 100%;
        }

        .common-layout {
            height: 100vh;
        }

        .el-container {
            height: 100%;
        }

        .el-header {
            background-color: #409EFF;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .el-aside {
            background-color: #f5f7fa;
            border-right: 1px solid #e6e6e6;
        }

        .el-main {
            padding: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
